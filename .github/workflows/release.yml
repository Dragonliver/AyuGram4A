name: Build release APK
on:
  push:
    branches: [ "master", "main" ] # Сборка будет запускаться при пуше в эти ветки
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой на сайте

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create API_KEYS file
        uses: DamianReeves/write-file-action@master
        with:
          path: ./API_KEYS
          contents: |
            APP_ID = 31671752
            APP_HASH = "e9a734e94a8126c71b4a27b4b693a56a"
            MAPS_V2_API = ${{ secrets.MAPS_KEY }}
            
            SIGNING_KEY_PASSWORD = ${{ secrets.CERT_KEY }}
            SIGNING_KEY_ALIAS = tgram
            SIGNING_KEY_STORE_PASSWORD = ${{ secrets.CERT_KEY }}
          write-mode: overwrite

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        # Этот экшен сам скачает нужные инструменты прямо к тебе в папку раннера

      - name: Build with Gradle
        # В Windows мы используем .\gradlew вместо ./gradlew
        # Флаг --stacktrace поможет увидеть ошибки, если они будут
        run: .\gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-APK
          # Проверь этот путь после первой сборки, в AyuGram он может немного отличаться
          path: TMessagesProj/build/outputs/apk/debug/*.apk
