name: Build release APK
on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create API_KEYS file
        uses: DamianReeves/write-file-action@master
        with:
          path: ./API_KEYS
          contents: |
            APP_ID = 31671752
            APP_HASH = "e9a734e94a8126c71b4a27b4b693a56a"
            MAPS_V2_API = ${{ secrets.MAPS_KEY }}
            
            SIGNING_KEY_PASSWORD = ${{ secrets.CERT_KEY }}
            SIGNING_KEY_ALIAS = tgram
            SIGNING_KEY_STORE_PASSWORD = ${{ secrets.CERT_KEY }}
          write-mode: overwrite

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Java Wrapper
        shell: cmd
        # Мы ищем jar-файл градла и запускаем его напрямую через java
        run: |
          for /r %%i in (gradle-wrapper.jar) do (
            if exist "%%i" (
              echo Found wrapper at %%i
              java -jar "%%i" assembleDebug --no-daemon -Pandroid.builder.sdkDownload=true
              exit /b 0
            )
          )
          echo "FATAL: gradle-wrapper.jar not found!"
          exit /b 1
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.jvmargs=-Xmx4g"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-APK
          path: "**/*.apk"
          if-no-files-found: error
